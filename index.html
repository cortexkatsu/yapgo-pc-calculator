<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator PC YapGO!</title>
    <!-- Memuat Font Google Resmi Sesuai Gambar -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* BASE & FONT ADJUSTMENT */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #F4EFEA;
            color: #1E1E1E;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px;
        }
        .container {
            width: 100%;
            max-width: 440px;
        }

        /* HEADER BRANDING */
        header {
            margin-bottom: 24px;
        }
        h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 36px;
            font-weight: 800;
            line-height: 0.95;
            text-transform: uppercase;
            letter-spacing: -0.05em;
        }
        h1 span {
            position: relative;
            z-index: 1;
        }
        h1 span::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 2px;
            width: 100%;
            height: 12px;
            background-color: #A5F3FC;
            z-index: -1;
            border-radius: 2px;
        }
        .brand-container {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
        }
        .brand-container .by {
            color: #6B7280;
            font-weight: 400;
        }
        .brand-badge {
            background-color: #E11D48;
            color: white;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1.5px solid black;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 1px 1px 0px black;
        }
        header p {
            font-size: 12px;
            color: #6B7280;
            margin-top: 16px;
            line-height: 1.5;
            max-width: 340px;
        }

        /* NEO-BRUTALISM CARD CONTEXT */
        .brutal-card {
            background-color: white;
            border: 2px solid #000000;
            border-radius: 24px;
            box-shadow: 5px 5px 0px 0px #000000;
            overflow: hidden;
        }
        .card-body {
            padding: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .flex-row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .label-upper {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: #6B7280;
        }
        .btn-reset {
            background: none;
            border: none;
            font-size: 10px;
            font-weight: 700;
            color: #4B5563;
            cursor: pointer;
        }
        .btn-reset:hover {
            color: black;
        }

        /* FORM INPUT (Sizing Persis Gambar Anda) */
        select, input {
            width: 100%;
            background-color: white;
            border: 2px solid #000000;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700; /* Font angka tebal sesuai gambar */
            outline: none;
        }
        select {
            background-color: #FCF8F2;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-badge {
            position: absolute;
            right: 12px;
            background-color: #000000;
            color: #ffffff;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 4px;
        }
        .detail-container {
            display: none;
            padding-top: 20px;
            border-top: 2px dashed #E5E7EB;
        }

        /* SUBMIT BUTTON */
        .btn-hitung {
            width: 100%;
            background-color: #E11D48;
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 800;
            padding: 16px;
            border-radius: 16px;
            border: 2px solid #000000;
            box-shadow: 2px 2px 0px 0px #000000;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 16px;
        }
        .btn-hitung:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px 0px #000000;
        }

        /* PURPLE BILLING SUM (Sizing Hasil Sesuai Gambar) */
        .hasil-box {
            display: none;
            background-color: #581C87;
            border-top: 2px solid #000000;
            padding: 24px;
            color: white;
        }
        .hasil-label {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.1em;
            color: #E9D5FF;
            text-transform: uppercase;
            border-top: 1px dashed rgba(233, 213, 255, 0.3);
            padding-top: 4px;
            margin-bottom: 8px;
        }
        .hasil-nilai {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 42px; /* Diperbesar persis seperti gambar Anda */
            font-weight: 900;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>KALKULATOR<br> <span>PC</span></h1>
            <div class="brand-container">
                <span class="by">by</span>
                <span class="brand-badge">YapGO!</span>
            </div>
            <p>Pilih, isi, dan dapatkan estimasi harga bersih PC dari negara asalnya.</p>
        </header>

        <div class="brutal-card">
            <div class="card-body">
                <div class="flex-row-header">
                    <span class="label-upper">-PILIH NEGARA-</span>
                    <button onclick="resetForm()" class="btn-reset">⟲ RESET</button>
                </div>
                <div class="form-group">
                    <select id="selectNegara" onchange="gantiNegara()">
                        <option value="">— Pilih negara —</option>
                        <option value="CN">China</option>
                        <option value="PH">Filipina</option>
                        <option value="JP">Jepang</option>
                        <option value="KR">Korea</option>
                        <option value="TH">Thailand</option>
                    </select>
                </div>

                <div id="detailContainer" class="detail-container">
                    <div class="label-upper" style="margin-bottom: 16px;">DETAIL HARGA</div>
                    <div class="form-group">
                        <div class="label-upper" id="labelRate" style="font-size: 9px; margin-bottom: 4px;">RATE</div>
                        <div class="input-wrapper">
                            <input type="number" id="inputRate" placeholder="0">
                            <span class="input-badge">IDR</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="label-upper" style="font-size: 9px; margin-bottom: 4px;">HARGA PC</div>
                        <div class="input-wrapper">
                            <input type="number" id="inputHargaPc" placeholder="0">
                            <span class="input-badge valas-badge">VALAS</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="label-upper" style="font-size: 9px; margin-bottom: 4px;">SHIPLOC</div>
                        <div class="input-wrapper">
                            <input type="number" id="inputShiploc" placeholder="0">
                            <span class="input-badge valas-badge">VALAS</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="label-upper" style="font-size: 9px; margin-bottom: 4px;">JUMLAH BUYER</div>
                        <div class="input-wrapper">
                            <input type="number" id="inputBuyer" min="1" value="1" style="background-color: #FCF8F2;">
                            <span class="input-badge">PAX</span>
                        </div>
                    </div>
                    <button onclick="prosesHitung()" class="btn-hitung">🖥 HITUNG HARGA</button>
                </div>
            </div>
            <div id="hasilBox" class="hasil-box">
                <div class="hasil-label" id="hasilLabelNegara">HARGA BERSIH</div>
                <div class="hasil-nilai" id="textHasil">Rp 0</div>
            </div>
        </div>
    </div>

        <script>
        const daftarNegara = {
            'CN': { nama: 'China', mataUang: 'RMB', feeTf: 6000 },
            'PH': { nama: 'Filipina', mataUang: 'PHP', feeTf: 10000 },
            'JP': { nama: 'Jepang', mataUang: 'JPY', feeTf: 10000 },
            'KR': { nama: 'Korea', mataUang: 'KRW', feeTf: 15000 },
            'TH': { nama: 'Thailand', mataUang: 'THB', feeTf: 9000 }
        };

        function gantiNegara() {
            const code = document.getElementById('selectNegara').value;
            const container = document.getElementById('detailContainer');
            const hasilBox = document.getElementById('hasilBox');
            
            hasilBox.style.display = 'none';
            
            if (!code || !daftarNegara[code]) {
                container.style.display = 'none';
                return;
            }

            const data = daftarNegara[code];
            
            document.getElementById('labelRate').innerText = 'RATE (' + data.mataUang + ' ➔ IDR)';
            const badges = document.getElementsByClassName('valas-badge');
            for(let b of badges) {
                b.innerText = data.mataUang;
            }

            document.getElementById('inputRate').value = ''; 
            document.getElementById('inputHargaPc').value = '';
            document.getElementById('inputShiploc').value = '';
            document.getElementById('inputBuyer').value = 1;

            container.style.display = 'block';
        }

        function prosesHitung() {
            const code = document.getElementById('selectNegara').value;
            if(!code || !daftarNegara[code]) return;

            const data = daftarNegara[code];
            
            // Pengambilan data input (Memperbaiki typo getElementIds)
            const rate = Number(document.getElementById('inputRate').value) || 0;
            let pc = Number(document.getElementById('inputHargaPc').value) || 0;
            let shiploc = Number(document.getElementById('inputShiploc').value) || 0;
            let buyer = Number(document.getElementById('inputBuyer').value) || 1;
            if(buyer < 1) buyer = 1;

            const feeGo = 4000;
            const feeTfBank = data.feeTf;

            if (code === 'KR') {
                pc = pc * 10000;
                shiploc = shiploc * 10000;
            }

            // Rumus Akurat Sesuai Instruksi Anda
            const sisiKiri = (pc * rate) + feeGo;
            const sisiKanan = ((shiploc * rate) + feeTfBank) / buyer;
            const totalAkhir = Math.ceil(sisiKiri + sisiKanan);

            document.getElementById('hasilLabelNegara').innerText = 'HARGA BERSIH ' + data.nama.toUpperCase();
            document.getElementById('textHasil').innerText = 'Rp ' + totalAkhir.toLocaleString('id-ID');
            
            // Menampilkan kotak hasil secara instan ke layar bawah tanpa macet
            document.getElementById('hasilBox').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('selectNegara').value = '';
            document.getElementById('detailContainer').style.display = 'none';
            document.getElementById('hasilBox').style.display = 'none';
        }
    </script>
</body>
</html>
